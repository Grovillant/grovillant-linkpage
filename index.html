<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grovillant - Connect With Us</title>
    <meta name="description" content="Connect with Grovillant on WhatsApp and Email. Global Sourcing, Quality Goods, Trusted Partner.">

    <!-- OG 分享卡片 -->
    <meta property="og:title" content="Grovillant - Connect With Us">
    <meta property="og:description" content="Global Sourcing · Quality Goods · Trusted Partner. Contact us on WhatsApp or Email.">
    <meta property="og:image" content="https://grovillant.com/og-image.png">
    <meta property="og:url" content="https://grovillant.com">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Vercel 访问统计（无 cookie，不收集个人信息） -->
    <script defer src="/_vercel/insights/script.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .profile {
            margin-bottom: 32px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            background: #fff;
        }
        .brand-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .brand-tagline {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            font-weight: 400;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border-radius: 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .link-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .link-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .link-btn.whatsapp:hover {
            background: rgba(37, 211, 102, 0.2);
            border-color: rgba(37, 211, 102, 0.4);
        }
        .link-btn.email:hover {
            background: rgba(234, 67, 53, 0.2);
            border-color: rgba(234, 67, 53, 0.4);
        }
        .footer {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
        }
        .footer a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container > * {
            animation: fadeIn 0.6s ease forwards;
        }
        .profile { animation-delay: 0.1s; opacity: 0; }
        .links { animation-delay: 0.2s; opacity: 0; }
        .footer { animation-delay: 0.4s; opacity: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="logo.jpg" alt="Grovillant Logo" class="avatar">
            <h1 class="brand-name">Grovillant</h1>
            <p class="brand-tagline">Global Sourcing · Quality Goods · Trusted Partner</p>
        </div>

        <div class="links">
            <!-- WhatsApp -->
            <a href="https://wa.me/message/Q74G5M2IAFOQK1" target="_blank" class="link-btn whatsapp">

                WhatsApp Business
            </a>

            <!-- Email -->
            <a href="mailto:cloudwander@grovillant.com" class="link-btn email">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                Email Us
            </a>
        </div>

        <div class="footer">
            <p>© 2026 Grovillant. All rights reserved.</p>
            <p style="margin-top: 4px;">grovillant.com</p>
        </div>
    </div>
</body>
</html>
